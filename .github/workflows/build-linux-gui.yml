name: Build Ubuntu 22.04 desktop app

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      NO_AT_BRIDGE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu GUI and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3.10-venv python3.10-dev python3-gi python3-gi-cairo python3-cairo \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.0 gir1.2-ayatanaappindicator3-0.1 gir1.2-freedesktop \
            libwebkit2gtk-4.0-37 libglib2.0-bin dpkg-dev desktop-file-utils \
            xvfb xauth dbus-x11 xdotool fonts-noto-cjk
      - name: Install Python dependencies with system GI bindings
        run: |
          /usr/bin/python3.10 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
      - name: Check publication contents and run regression tests
        run: |
          .venv/bin/python scripts/check_publication.py
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python -m unittest discover -s campus-login-cli/tests -v
          node --check ui/web/app.js
      - name: Exercise the actual GTK WebView interface
        run: |
          timeout 180s dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1100x24' \
            .venv/bin/python tests/smoke_linux_gui.py --output-dir dist/linux-smoke/source
      - name: Build Ubuntu desktop packages
        run: PYTHON="$PWD/.venv/bin/python" bash scripts/build-linux-gui.sh
      - name: Install and launch the packaged desktop application
        run: |
          sudo apt-get install -y ./dist/linux/WOFO-Login_*_ubuntu22.04_amd64.deb
          timeout 120s dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1100x24' \
            .venv/bin/python tests/smoke_linux_package.py \
            /usr/bin/wofo-login-gui --output-dir dist/linux-smoke/installed
          sudo apt-get remove -y wofo-login-gui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WOFO-Login-Ubuntu-22.04-amd64
          path: |
            dist/linux/*.deb
            dist/linux/*.tar.gz
            dist/linux/*SHA256*
            dist/linux-smoke/
          if-no-files-found: warn
