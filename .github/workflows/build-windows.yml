name: Build Windows desktop app

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check publication contents
        run: python scripts/check_publication.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run desktop tests
        run: python -m unittest discover -s tests -v
      - name: Run CLI tests
        run: python -m unittest discover -s campus-login-cli/tests -v
      - name: Check WebView JavaScript
        run: node --check ui/web/app.js
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --distpath dist/webview "校园网守护.spec"
      - name: Verify and package release
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: WOFO-Login-Windows
          path: dist/WOFO Login.zip
          if-no-files-found: error
