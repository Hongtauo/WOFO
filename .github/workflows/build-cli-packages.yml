name: Build CLI packages

on:
  workflow_dispatch:
  push:
    tags:
      - "cli-v*"

jobs:
  linux-deb:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-amd64
          - runner: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: campus-login-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyinstaller
      - run: ./build-linux-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: campus-login-${{ matrix.artifact }}
          path: campus-login-cli/dist/*.deb

  macos-binary:
    runs-on: macos-14
    defaults:
      run:
        working-directory: campus-login-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyinstaller
      - run: ./build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: campus-login-macos-arm64
          path: campus-login-cli/dist/campus-login
