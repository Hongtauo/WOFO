name: Build CLI packages

on:
  workflow_dispatch:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read

jobs:
  linux-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-amd64
          - runner: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: campus-login-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/cli-v* ]]; then
            version="${GITHUB_REF_NAME#cli-v}"
          else
            version="0.0.0-dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build Linux binary on the oldest supported userspace
        working-directory: .
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src/campus-login-cli \
            ubuntu:20.04 \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                binutils python3 python3-dev python3-pip
              python3 -m pip install "pyinstaller==6.15.0"
              python3 -m PyInstaller --noconfirm --clean --onefile \
                --name wofologin campus_login_cli.py
              chown -R --reference=/src build dist wofologin.spec
            '
      - name: Verify binary on Ubuntu 20.04
        working-directory: .
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            ubuntu:20.04 \
            /src/campus-login-cli/dist/wofologin --help
      - name: Build and validate Debian package
        run: |
          SKIP_BINARY_BUILD=1 VERSION="${{ steps.version.outputs.version }}" \
            ./build-linux-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WOFOLogin-${{ matrix.artifact }}
          path: campus-login-cli/dist/*.deb
          if-no-files-found: error

  macos-binary:
    runs-on: macos-14
    defaults:
      run:
        working-directory: campus-login-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/cli-v* ]]; then
            version="${GITHUB_REF_NAME#cli-v}"
          else
            version="0.0.0-dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python -m pip install pyinstaller
      - run: ./build-macos.sh
      - name: Add version and architecture to filename
        run: mv dist/wofologin "dist/WOFOLogin_${{ steps.version.outputs.version }}_macos_arm64"
      - uses: actions/upload-artifact@v4
        with:
          name: WOFOLogin-macos-arm64
          path: campus-login-cli/dist/WOFOLogin_*_macos_arm64
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs:
      - linux-deb
      - macos-binary
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: WOFOLogin-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "WOFOLogin $version" \
            --generate-notes \
            --verify-tag
